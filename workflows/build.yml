name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target UberknallInspired_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uberknall-Inspired-Windows-VST3
          path: build/UberknallInspired_artefacts/Release/VST3
